# Versao NPU: converte os modelos (ONNX) para DLC quantizado do SNPE 2.12, o
# mesmo SNPE que a AIBOX tem. Roda aqui porque o conversor so existe para
# Linux x86 e precisa baixar o SDK da Qualcomm.
name: npu-modelos
on:
  push:
    branches: [npu/divisao-npu-cpu]
    paths: ['npu/**', '.github/workflows/npu-modelos.yml']
  workflow_dispatch:

jobs:
  converter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: sondar versoes do SNPE
        run: |
          B=https://softwarecenter.qualcomm.com/api/download/software
          for v in 2.12.0.230626 2.12.4.230825 2.13.0.230730 2.20.0.240223 2.26.0.240828; do
            for u in "$B/qualcomm_neural_processing_sdk/v$v.zip" "$B/sdks/Qualcomm_AI_Runtime_Community/All/$v/v$v.zip" "$B/sdks/Qualcomm_Neural_Processing_SDK/Linux/$v/v$v.zip" "$B/sdks/Qualcomm_Neural_Processing_SDK/All/$v/v$v.zip"; do
              echo "$(curl -sL -o /dev/null -r 0-99 -w '%{http_code} %{size_download} %{url_effective}' "$u") <- $u"
            done
          done
